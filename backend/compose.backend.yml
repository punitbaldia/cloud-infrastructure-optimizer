# Backend-only development services; Person 3 owns the root Compose file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer_dev
      POSTGRES_DB: optimizer
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - optimizer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer -d optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  optimizer_pg:
