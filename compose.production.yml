# Use with docker-compose.yml on a Linux host with a real DNS name.
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  backend:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  beat:
    restart: unless-stopped
  frontend:
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set your DNS hostname in root .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
