services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: optimizer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer -d optimizer"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build: ./backend
    env_file: ./backend/.env
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://optimizer:${POSTGRES_PASSWORD}@postgres:5432/optimizer
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: celery
    command: python -m alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend_env
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend_env
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
  beat:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend_env
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
